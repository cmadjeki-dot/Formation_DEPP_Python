name: Deploy gallery to gh-pages branch

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public directory
        run: |
          echo "Copying outputs/figures to public/"
          rm -rf public || true
          mkdir -p public
          if [ -d "outputs/figures" ]; then
            cp -r outputs/figures/* public/ || true
          else
            echo "outputs/figures not found"
          fi

      - name: Setup Node (required by some gh-pages actions)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Debug - list repo and public files
        run: |
          echo "== Git status =="
          git status --porcelain || true
          echo "== Repo root listing =="
          ls -la || true
          echo "== outputs/figures listing =="
          if [ -d "outputs/figures" ]; then
            ls -la outputs/figures || true
          else
            echo "outputs/figures does not exist"
          fi
          echo "== public listing =="
          ls -la public || true
          echo "== gallery head (first 40 lines) =="
          if [ -f outputs/figures/gallery.html ]; then
            head -n 40 outputs/figures/gallery.html || true
          else
            echo "gallery.html not found at outputs/figures/gallery.html"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
