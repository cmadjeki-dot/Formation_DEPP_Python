name: Deploy gallery to gh-pages branch

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public directory
        run: |
          echo "Copying outputs/figures to public/"
          rm -rf public || true
          mkdir -p public
          if [ -d "outputs/figures" ]; then
            cp -r outputs/figures/* public/ || true
          else
            echo "outputs/figures not found"
          fi

      - name: Setup Node (required by some gh-pages actions)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
