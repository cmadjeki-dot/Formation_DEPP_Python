name: Deploy gallery to gh-pages branch

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate tables, report and site
        run: |
          python -m pip install --disable-pip-version-check pandas
          python scripts/build_static_site.py

      - name: Prepare public directory
        run: |
          echo "Building static restitution site"
          rm -rf public || true
          mkdir -p public
          cp -r site/* public/
          cp -r outputs/figures public/figures
          cp -r outputs/tables public/tables
          cp -r outputs/reports public/reports
          cp docs/rapport_final.md public/rapport_final.md

      - name: Verify published files
        run: |
          test -f public/index.html
          test -f public/figures/score_par_pcs_hd.png
          test -f public/tables/scores_par_pcs.html
          test -f public/reports/rapport_synthese.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
